# OlbosQuant — Hetzner VPS Production (IBKR headless)
#
# All services self-hosted on a single VPS — replaces MacBook local setup.
# IB Gateway runs headlessly in Docker (paper port 4002).
# Images are built directly on the server — no external registry required.
#
# Usage (first deploy):
#   docker compose -f docker-compose.hetzner.yml up -d --build
#   docker compose -f docker-compose.hetzner.yml exec backend alembic upgrade head
#
# To view IB Gateway GUI remotely (VNC):
#   ssh -L 5900:localhost:5900 deploy@YOUR_SERVER_IP
#   Then open any VNC viewer → localhost:5900 (password from VNC_PASSWORD env)

version: "3.11"

services:

  # ── IB Gateway (headless paper trading) ───────────────────────────────────
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: olbosquant_ib_gateway
    restart: always
    environment:
      TWS_USERID:           ${IBKR_USERNAME}
      TWS_PASSWORD:         ${IBKR_PASSWORD}
      TRADING_MODE:         ${IBKR_TRADING_MODE:-paper}
      GATEWAY_OR_TWS:       gateway
      VNC_SERVER_PASSWORD:  ${VNC_PASSWORD}
      TWOFA_TIMEOUT_ACTION: restart
    ports:
      - "127.0.0.1:4002:4002"   # paper socket — localhost only (not public)
      - "127.0.0.1:5900:5900"   # VNC — SSH tunnel to access remotely
    volumes:
      - ib_gateway_data:/home/ibgateway/Jts
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4002 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s   # IB Gateway takes ~60-90s to boot
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: olbosquant_postgres
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-options_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-options_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-options_user} -d ${POSTGRES_DB:-options_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: olbosquant_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: olbosquant_backend
    restart: always
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-options_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-options_db}
      REDIS_URL: redis://redis:6379
      IBKR_HOST: ib-gateway
      IBKR_PORT: "4002"
      IBKR_CLIENT_ID: "1"
    expose:
      - "8000"
    volumes:
      - ml_models:/app/ml/model_registry
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ib-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── React frontend (nginx, production build) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""   # Empty = same origin, routed via nginx
    container_name: olbosquant_frontend
    restart: always
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx reverse proxy + SSL ──────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: olbosquant_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/olbosquant.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Certbot (auto-renew Let's Encrypt SSL) ─────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: olbosquant_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  postgres_data:
  redis_data:
  ml_models:
  app_logs:
  certbot_certs:
  certbot_www:
  ib_gateway_data:

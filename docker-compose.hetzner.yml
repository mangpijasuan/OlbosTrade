# ═══════════════════════════════════════════════════════════════════════════════
# OlbosTrade — Hetzner production stack
#
# Runs ALONGSIDE the existing olbos app on the same server.
# Caddy (already running in olbos) handles HTTPS for both apps.
# OlbosTrade joins the olbos Docker network so Caddy can reach it.
#
# Usage — on the server inside /opt/olbostrade:
#   bash deploy/hetzner/up.sh
#
# NOTE on the DB service: we are renaming the Postgres role and database to
# the new `olbostrade` names in this Compose file and the deploy docs. The
# actual on-disk data volume was created previously and is pinned by name to
# the existing volume. To avoid accidental data loss the Compose volume is
# still mapped to the original external volume name (see `volumes:` below).
# Changing these names on a running cluster requires a migration (dump+restore
# or in-cluster CREATE ROLE/CREATE DATABASE + data copy). Read the migration
# notes in `deploy/hetzner/README.md` before applying on production.
#
# IMPORTANT — the pgdata volume is pinned with `external: true` + an explicit
# `name:` below, pointing at the volume Compose actually created back when
# this directory was named /opt/olbosquant (Compose prefixes unpinned volume
# names with a project name derived from the directory, so renaming the
# directory silently produces a DIFFERENT, empty volume unless pinned like
# this). `external: true` also makes `docker compose up` fail loudly if that
# volume doesn't exist, instead of silently creating a fresh empty one.
# ═══════════════════════════════════════════════════════════════════════════════

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: olbostrade-backend
    restart: unless-stopped
    env_file:
      - backend/.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://olbostrade:${OLBOSTRADE_DB_PASSWORD}@olbostrade-db:5432/olbostrade
    depends_on:
      olbostrade-db:
        condition: service_healthy
    networks:
      - olbostrade_internal
      - olbos_default        # joins existing Caddy network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/guardrails/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_WS_URL: ""
    container_name: olbostrade-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://olbostrade-backend:8000
      # Set DASH_USER/DASH_PASS in backend/.env.prod to password-protect the whole
      # dashboard + API (HTTP Basic Auth). Leave unset to serve open (NOT advised
      # when exposed by public IP).
      - DASH_USER=${DASH_USER:-}
      - DASH_PASS=${DASH_PASS:-}
    # Publish a host port for direct IP access (http://<server-ip>:8080) when no
    # domain is set up. Caddy (when used) still reaches it over the internal
    # network; this just additionally exposes it on the host.
    ports:
      - "8080:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - olbostrade_internal
      - olbos_default        # joins existing Caddy network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  olbostrade-db:
    image: postgres:16-alpine
    container_name: olbostrade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     olbostrade
      POSTGRES_PASSWORD: ${OLBOSTRADE_DB_PASSWORD:?set OLBOSTRADE_DB_PASSWORD in backend/.env.prod}
      POSTGRES_DB:       olbostrade
    volumes:
      - olbostrade_pgdata:/var/lib/postgresql/data
    networks:
      - olbostrade_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olbostrade -d olbostrade"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  olbostrade_pgdata:
    external: true
    name: olbosquant_olbosquant_pgdata   # pinned to the original external volume (see NOTE above)
  olbostrade_archive:

networks:
  olbostrade_internal:
    driver: bridge
  olbos_default:
    external: true
    name: docker_default    # the network Caddy is already on (created by the olbos app)
